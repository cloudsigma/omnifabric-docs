site_name: OmniFabric Docs
repo_name: cloudsigma/omnifabric-docs
repo_url: https://github.com/cloudsigma/omnifabric-docs
theme: readthedocs
# theme:
#   name: material
#   logo: assets/new-logo.png
#   features:
#     - content.code.copy
#     - content.action.edit
#     - navigation.instant
#     - navigation.tracking
#     - navigation.tabs
#     - navigation.tabs.sticky
#     - navigation.footer
#   palette:
#     scheme: mo
#   font:
#     text: Ubuntu
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
edit_uri: edit/main/docs/
# extra_css:
#   - stylesheets/extra.css
# extra_javascript:
#   - javascripts/extra.js
# extra:
#   homepage: https://www.OmniFabric.io
#   version:
#     provider: mike
#   alternate:
#     - name: English
#       link: /en/
#       lang: en
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
